<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-label="Forces around a software-company decision"><title>Forces around a software-company decision</title><desc>Illustrative questions adapted from the supplied Forces of Progress diagram. Push and pull face one direction; habit and anxiety oppose it. Not measured founder psychology or inevitable change.</desc><rect width="960" height="515" fill="#f8f7f2"/><text x="480.0" y="30" font-family="Arial,sans-serif" font-size="15" fill="#bd7626" text-anchor="middle" font-weight="700">WHAT MAY MOVE THE DECISION</text><polygon points="35,60 901,60 925,117.0 901,174 35,174 59,117.0" fill="#bd7626"/><text x="267" y="99" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">PUSH</text><text x="267" y="134" font-family="Arial,sans-serif" font-size="23" fill="white" text-anchor="middle" font-weight="400">Work keeps returning</text><text x="690" y="99" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">PULL</text><text x="690" y="134" font-family="Arial,sans-serif" font-size="23" fill="white" text-anchor="middle" font-weight="400">A useful ongoing service</text><polygon points="925,241 59,241 35,298.0 59,355 925,355 901,298.0" fill="#367f8c"/><text x="267" y="281" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">HABIT</text><text x="267" y="316" font-family="Arial,sans-serif" font-size="23" fill="white" text-anchor="middle" font-weight="400">Current workaround works</text><text x="690" y="281" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">ANXIETY</text><text x="690" y="316" font-family="Arial,sans-serif" font-size="23" fill="white" text-anchor="middle" font-weight="400">Cost, time, responsibility</text><circle cx="480" cy="208" r="35" fill="#163e35"/><g transform="translate(480 214)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18,-4A8,8 0 1 1 -18,-20A8,8 0 1 1 -18,-4 M18,-4A8,8 0 1 1 18,-20A8,8 0 1 1 18,-4 M-30,23V12Q-18,0 -6,12V23 M6,23V12Q18,0 30,12V23"/></g><text x="480" y="402" font-family="Arial,sans-serif" font-size="15" fill="#163e35" text-anchor="middle" font-weight="700">WHAT STILL NEEDS EVIDENCE</text><circle cx="160" cy="451" r="5" fill="#163e35"/><text x="160" y="485" font-family="Arial,sans-serif" font-size="20" fill="#163e35" text-anchor="middle" font-weight="400">Repeated task</text><circle cx="480" cy="451" r="5" fill="#163e35"/><text x="480" y="485" font-family="Arial,sans-serif" font-size="20" fill="#163e35" text-anchor="middle" font-weight="400">Reason to keep paying</text><circle cx="800" cy="451" r="5" fill="#163e35"/><text x="800" y="485" font-family="Arial,sans-serif" font-size="20" fill="#163e35" text-anchor="middle" font-weight="400">Operating people</text></svg>