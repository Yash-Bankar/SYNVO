<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 730" role="img" aria-label="Forces around a software-company decision"><title>Forces around a software-company decision</title><desc>Illustrative questions adapted from the supplied Forces of Progress diagram. Push and pull face one direction; habit and anxiety oppose it. Not measured founder psychology or inevitable change.</desc><rect width="360" height="730" fill="#f8f7f2"/><text x="180.0" y="30" font-family="Arial,sans-serif" font-size="15" fill="#bd7626" text-anchor="middle" font-weight="700">WHAT MAY MOVE THE DECISION</text><polygon points="16,52 320,52 344,96.0 320,140 16,140 40,96.0" fill="#bd7626"/><text x="180" y="86" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">PUSH</text><text x="180" y="114" font-family="Arial,sans-serif" font-size="17" fill="white" text-anchor="middle" font-weight="400">Work keeps returning</text><polygon points="16,157 320,157 344,201.0 320,245 16,245 40,201.0" fill="#bd7626"/><text x="180" y="191" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">PULL</text><text x="180" y="219" font-family="Arial,sans-serif" font-size="17" fill="white" text-anchor="middle" font-weight="400">A useful ongoing service</text><polygon points="344,347 40,347 16,391.0 40,435 344,435 320,391.0" fill="#367f8c"/><text x="180" y="381" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">HABIT</text><text x="180" y="409" font-family="Arial,sans-serif" font-size="17" fill="white" text-anchor="middle" font-weight="400">Current workaround works</text><polygon points="344,452 40,452 16,496.0 40,540 344,540 320,496.0" fill="#367f8c"/><text x="180" y="486" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">ANXIETY</text><text x="180" y="514" font-family="Arial,sans-serif" font-size="17" fill="white" text-anchor="middle" font-weight="400">Cost, time, responsibility</text><circle cx="180" cy="293" r="35" fill="#163e35"/><g transform="translate(180 300)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-18,-4A8,8 0 1 1 -18,-20A8,8 0 1 1 -18,-4 M18,-4A8,8 0 1 1 18,-20A8,8 0 1 1 18,-4 M-30,23V12Q-18,0 -6,12V23 M6,23V12Q18,0 30,12V23"/></g><text x="180" y="580" font-family="Arial,sans-serif" font-size="14" fill="#163e35" text-anchor="middle" font-weight="700">WHAT STILL NEEDS EVIDENCE</text><text x="180" y="621" font-family="Arial,sans-serif" font-size="17" fill="#163e35" text-anchor="middle" font-weight="400">Repeated customer task</text><text x="180" y="655" font-family="Arial,sans-serif" font-size="17" fill="#163e35" text-anchor="middle" font-weight="400">Reason to choose and keep paying</text><text x="180" y="689" font-family="Arial,sans-serif" font-size="17" fill="#163e35" text-anchor="middle" font-weight="400">People to build and run the service</text></svg>