<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" role="img" aria-label="Creator priority rankings"><title>Creator priority rankings</title><desc>Two ranked lists from Patreon: recalled priorities and survey-time priorities. Circle size does not encode amounts.</desc><rect width="360" height="680" fill="#f8f7f2"/><text x="24" y="38" font-family="Arial,sans-serif" font-size="13" fill="#367f8c" text-anchor="start" font-weight="700">RECALLED · FIVE YEARS EARLIER</text><path d="M45,68L45,275" fill="none" stroke="#367f8c" stroke-width="3"/><circle cx="45" cy="100" r="21" fill="#367f8c"/><text x="45" y="108" font-family="Arial,sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><text x="82" y="108" font-family="Arial,sans-serif" font-size="18" fill="#163e35" text-anchor="start" font-weight="400">Follower count</text><circle cx="45" cy="183" r="21" fill="#367f8c"/><text x="45" y="191" font-family="Arial,sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><text x="82" y="191" font-family="Arial,sans-serif" font-size="18" fill="#163e35" text-anchor="start" font-weight="400">Likes, comments, shares</text><circle cx="45" cy="266" r="21" fill="#367f8c"/><text x="45" y="274" font-family="Arial,sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><text x="82" y="274" font-family="Arial,sans-serif" font-size="18" fill="#163e35" text-anchor="start" font-weight="400">Views, listens, watch hours</text><text x="24" y="373" font-family="Arial,sans-serif" font-size="13" fill="#bd7626" text-anchor="start" font-weight="700">AT THE SURVEY · AUGUST 2024</text><path d="M45,403L45,610" fill="none" stroke="#bd7626" stroke-width="3"/><circle cx="45" cy="435" r="21" fill="#bd7626"/><text x="45" y="443" font-family="Arial,sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="700">1</text><text x="82" y="443" font-family="Arial,sans-serif" font-size="18" fill="#163e35" text-anchor="start" font-weight="400">Quality of creative work</text><circle cx="45" cy="518" r="21" fill="#bd7626"/><text x="45" y="526" font-family="Arial,sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="700">2</text><text x="82" y="526" font-family="Arial,sans-serif" font-size="18" fill="#163e35" text-anchor="start" font-weight="400">Fan relationships</text><circle cx="45" cy="601" r="21" fill="#bd7626"/><text x="45" y="609" font-family="Arial,sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="700">3</text><text x="82" y="609" font-family="Arial,sans-serif" font-size="18" fill="#163e35" text-anchor="start" font-weight="400">Financial stability</text></svg>