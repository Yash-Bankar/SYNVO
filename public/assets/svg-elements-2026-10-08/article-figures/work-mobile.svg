<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1060" role="img" aria-label="Three forms of customer help"><title>Three forms of customer help</title><desc>Course: instruction and practice. Resource: a structure to use. Software: service as work returns. Qualitative comparison, not a ladder or measured ranking.</desc><rect width="360" height="1060" fill="#f8f7f2"/><text x="180" y="45" font-family="Arial,sans-serif" font-size="15" fill="#367f8c" text-anchor="middle" font-weight="700">COURSE</text><circle cx="180" cy="132" r="60" fill="#e9eee5"/><g transform="translate(180 132)" fill="none" stroke="#367f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-24,-18Q-10,-24 0,-13Q10,-24 24,-18V20Q10,14 0,24Q-10,14 -24,20Z M0,-13V24"/></g><text x="180" y="229" font-family="Arial,sans-serif" font-size="23" fill="#163e35" text-anchor="middle" font-weight="700">Learn the work</text><text x="180" y="271" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Instruction → practice</text><text x="180" y="299" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Customer applies the lesson</text><text x="180" y="390" font-family="Arial,sans-serif" font-size="15" fill="#bd7626" text-anchor="middle" font-weight="700">RESOURCE</text><circle cx="180" cy="477" r="60" fill="#e9eee5"/><g transform="translate(180 477)" fill="none" stroke="#bd7626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-23,-23H23V23H-23Z M-23,-7H23 M-7,-23V23 M-23,8H23"/></g><text x="180" y="574" font-family="Arial,sans-serif" font-size="23" fill="#163e35" text-anchor="middle" font-weight="700">Use a structure</text><text x="180" y="616" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Guide, program or template</text><text x="180" y="644" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Customer puts it to work</text><text x="180" y="735" font-family="Arial,sans-serif" font-size="15" fill="#163e35" text-anchor="middle" font-weight="700">SOFTWARE</text><circle cx="180" cy="822" r="60" fill="#e9eee5"/><g transform="translate(180 822)" fill="none" stroke="#163e35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,-5A24,24 0 0 1 19,-15 M19,-15V-29 M19,-15H5 M22,5A24,24 0 0 1 -19,15 M-19,15V29 M-19,15H-5"/></g><text x="180" y="919" font-family="Arial,sans-serif" font-size="23" fill="#163e35" text-anchor="middle" font-weight="700">Serve returning work</text><text x="180" y="961" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">New inputs → useful output</text><text x="180" y="989" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Company maintains the service</text><path d="M98,841 C75,751 285,751 262,841" fill="none" stroke="#163e35" stroke-width="2"/><path d="M253,828L262,841L274,831" fill="none" stroke="#163e35" stroke-width="2"/></svg>