<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" role="img" aria-label="Three forms of customer help"><title>Three forms of customer help</title><desc>Course: instruction and practice. Resource: a structure to use. Software: service as work returns. Qualitative comparison, not a ladder or measured ranking.</desc><rect width="960" height="395" fill="#f8f7f2"/><text x="160" y="42" font-family="Arial,sans-serif" font-size="15" fill="#367f8c" text-anchor="middle" font-weight="700">COURSE</text><circle cx="160" cy="129" r="60" fill="#e9eee5"/><g transform="translate(160 129)" fill="none" stroke="#367f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-24,-18Q-10,-24 0,-13Q10,-24 24,-18V20Q10,14 0,24Q-10,14 -24,20Z M0,-13V24"/></g><text x="160" y="226" font-family="Arial,sans-serif" font-size="23" fill="#163e35" text-anchor="middle" font-weight="700">Learn the work</text><text x="160" y="268" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Instruction → practice</text><text x="160" y="296" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Customer applies the lesson</text><text x="480" y="42" font-family="Arial,sans-serif" font-size="15" fill="#bd7626" text-anchor="middle" font-weight="700">RESOURCE</text><circle cx="480" cy="129" r="60" fill="#e9eee5"/><g transform="translate(480 129)" fill="none" stroke="#bd7626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-23,-23H23V23H-23Z M-23,-7H23 M-7,-23V23 M-23,8H23"/></g><text x="480" y="226" font-family="Arial,sans-serif" font-size="23" fill="#163e35" text-anchor="middle" font-weight="700">Use a structure</text><text x="480" y="268" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Guide, program or template</text><text x="480" y="296" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Customer puts it to work</text><text x="800" y="42" font-family="Arial,sans-serif" font-size="15" fill="#163e35" text-anchor="middle" font-weight="700">SOFTWARE</text><circle cx="800" cy="129" r="60" fill="#e9eee5"/><g transform="translate(800 129)" fill="none" stroke="#163e35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-22,-5A24,24 0 0 1 19,-15 M19,-15V-29 M19,-15H5 M22,5A24,24 0 0 1 -19,15 M-19,15V29 M-19,15H-5"/></g><text x="800" y="226" font-family="Arial,sans-serif" font-size="23" fill="#163e35" text-anchor="middle" font-weight="700">Serve returning work</text><text x="800" y="268" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">New inputs → useful output</text><text x="800" y="296" font-family="Arial,sans-serif" font-size="17" fill="#58655f" text-anchor="middle" font-weight="400">Company maintains the service</text><path d="M718,148 C695,58 905,58 882,148" fill="none" stroke="#163e35" stroke-width="2"/><path d="M873,135L882,148L894,138" fill="none" stroke="#163e35" stroke-width="2"/></svg>